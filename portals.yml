# Portal Scanner Configuration — Mohamed Ashraf (Senior Data Engineer)
# Customized for: Data Engineer, Data Platform Engineer, Analytics Engineer,
# Data Analyst, Data Product Manager
# Target markets: UAE, KSA, UK, Ireland, EU, Canada — remote or relocation

title_filter:
  positive:
    # -- Data Engineering --
    - "Data Engineer"
    - "Data Platform"
    - "Analytics Engineer"
    - "Data Analyst"
    - "Data Product"
    - "Data Infrastructure"
    - "Data Architect"
    - "Data Operations"
    - "DataOps"
    - "MLOps"
    - "ML Engineer"
    - "Machine Learning Engineer"
    # -- Specific tools (signal strong match) --
    - "dbt"
    - "Snowflake"
    - "Databricks"
    - "Airflow"
    - "Dagster"
    - "Spark"
    - "PySpark"
    # -- Platform & infra roles --
    - "Platform Engineer"
    - "Data Reliability"
    - "BI Engineer"
    - "Analytics Platform"
  negative:
    - "Junior"
    - "Intern"
    - "Graduate"
    - "Entry Level"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP "
    - "COBOL"
    - "Mainframe"
    - "Cairo"
    - "Egypt"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

search_queries:
  # -- Data engineering on major ATS --
  - name: Greenhouse — Data Engineer UAE/KSA
    query: 'site:job-boards.greenhouse.io "data engineer" OR "analytics engineer" Dubai OR "Abu Dhabi" OR Riyadh OR "Saudi Arabia" OR UAE OR KSA'
    enabled: true

  - name: Greenhouse — Data Engineer UK/IE
    query: 'site:job-boards.greenhouse.io "data engineer" OR "analytics engineer" London OR Dublin OR "United Kingdom" OR Ireland remote'
    enabled: true

  - name: Greenhouse — Data Platform Engineer remote
    query: 'site:job-boards.greenhouse.io "data platform engineer" OR "data infrastructure" OR "analytics engineer" remote'
    enabled: true

  - name: Ashby — Data Engineer remote
    query: 'site:jobs.ashbyhq.com "data engineer" OR "analytics engineer" OR "data platform" remote'
    enabled: true

  - name: Ashby — Data Engineer EU/UK
    query: 'site:jobs.ashbyhq.com "data engineer" OR "analytics engineer" London OR Dublin OR Berlin OR Amsterdam OR remote'
    enabled: true

  - name: Lever — Data Engineer remote
    query: 'site:jobs.lever.co "data engineer" OR "analytics engineer" OR "data platform" remote'
    enabled: true

  - name: Lever — Data Engineer EU/UK/UAE
    query: 'site:jobs.lever.co "data engineer" OR "analytics engineer" London OR Dubai OR Amsterdam OR remote'
    enabled: true

  - name: Greenhouse — dbt Snowflake Databricks
    query: 'site:job-boards.greenhouse.io "dbt" OR "Snowflake" OR "Databricks" engineer remote UK OR Europe OR Canada'
    enabled: true

  - name: Greenhouse — Data Analyst senior
    query: 'site:job-boards.greenhouse.io "senior data analyst" OR "staff data analyst" OR "lead data analyst" remote'
    enabled: true

  - name: Ashby — Data Analyst senior
    query: 'site:jobs.ashbyhq.com "senior data analyst" OR "data analyst" remote'
    enabled: true

  - name: Greenhouse — Data Product Manager
    query: 'site:job-boards.greenhouse.io "data product manager" OR "product manager data" remote'
    enabled: true

  - name: LinkedIn — Data Engineer UAE
    query: '"data engineer" OR "analytics engineer" site:linkedin.com/jobs Dubai OR "Abu Dhabi" OR UAE OR Riyadh 2026'
    enabled: true

  - name: LinkedIn — Data Engineer UK/Ireland remote
    query: '"senior data engineer" OR "analytics engineer" site:linkedin.com/jobs London OR Dublin OR UK OR Ireland remote 2026'
    enabled: true

  - name: LinkedIn — Data Engineer EU remote
    query: '"senior data engineer" OR "data platform engineer" site:linkedin.com/jobs Amsterdam OR Berlin OR Toronto OR Canada remote 2026'
    enabled: true

  - name: Workable — Data Engineer
    query: 'site:apply.workable.com "data engineer" OR "analytics engineer" remote OR "United Kingdom" OR UAE'
    enabled: true

